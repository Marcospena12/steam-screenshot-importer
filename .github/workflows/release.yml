name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          pytest -q

      - name: Generate assets
        run: |
          python tools/generate_assets.py

      - name: Build with PyInstaller
        run: |
          pyinstaller SteamShotBridge.spec

      - name: Install Inno Setup
        uses: choco-gh/setup-chocolatey@v1
        with:
          packages: innosetup

      - name: Compile Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path dist\SteamShotBridge\* -DestinationPath dist-installer\SteamShotBridge-Portable-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-installer/*.exe
            dist-installer/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
